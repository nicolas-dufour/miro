[project]
name = "miro-geneval"
version = "0.1.0"
description = "GenEval evaluation for Miro diffusion models"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy<2",
    "pandas",
    "pillow",
    "open-clip-torch==2.26.1",
    "clip-benchmark>=1.4",
    "mmdet>=3.0,<3.4",
    "mmcv>=2.0,<2.2",
    "mmengine",
    "pycocotools",
    "networkx==2.8.8",
    "openmim",
    "transformers<4.43",
]

[project.scripts]
geneval-evaluate = "evaluate_images:main"
geneval-summary = "summary_scores:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.extra-build-dependencies]
mmcv = ["setuptools"]
